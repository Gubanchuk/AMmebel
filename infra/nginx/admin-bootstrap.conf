# Временный конфиг только на время выпуска первого сертификата:
# без него nginx не стартует, потому что файлов сертификата ещё нет.
# После выпуска заменяется на admin.conf.
server {
    listen 80;
    server_name admin.am-fabrika.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'proxy up, certificate pending';
        add_header Content-Type text/plain;
    }
}
