# Сайт am-fabrika.ru.
#
# Статику собирает контейнер builder (infra/builder/server.mjs) и кладёт
# выпуск в /srv/site/releases/<время>; nginx отдаёт тот, на который смотрит
# ссылка /srv/site/current. Переключение на новый выпуск — одна операция,
# посетитель не застаёт сайт наполовину обновлённым.

# HTML не кэшируем: правка в админке должна быть видна сразу после пересборки.
map $sent_http_content_type $site_expires {
    default     off;
    ~^text/html epoch;
}

server {
    listen 80;
    server_name am-fabrika.ru www.am-fabrika.ru amfabrika.ru www.amfabrika.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://am-fabrika.ru$request_uri;
    }
}

# Дубли адреса — на основной.
server {
    listen 443 ssl;
    http2 on;
    server_name www.am-fabrika.ru amfabrika.ru www.amfabrika.ru;

    ssl_certificate     /etc/letsencrypt/live/am-fabrika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/am-fabrika.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://am-fabrika.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name am-fabrika.ru;

    ssl_certificate     /etc/letsencrypt/live/am-fabrika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/am-fabrika.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Сайту не нужны камера, микрофон, геолокация и платёжные API — запрещаем
    # их и для встроенных чужих скриптов.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # Сайт ещё не запущен: форма заявки никуда не отправляет, юр-тексты не
    # вставлены. Снимается на запуске (задача 18 плана).
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /srv/site/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    expires $site_expires;

    location / {
        try_files $uri $uri/ =404;
    }

    # Имена с хэшем сборки не меняются никогда.
    location ^~ /_astro/ {
        expires max;
    }

    # Фото из админки: время изменения зашито в имя файла.
    location ^~ /cms/ {
        expires 30d;
    }

    location ~* \.(?:webp|png|jpg|svg|ico|woff2)$ {
        expires 7d;
    }
}
