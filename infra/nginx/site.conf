# Сайт am-fabrika.ru.
#
# Статику собирает контейнер builder (infra/builder/server.mjs) и кладёт
# выпуск в /srv/site/releases/<время>; nginx отдаёт тот, на который смотрит
# ссылка /srv/site/current. Переключение на новый выпуск — одна операция,
# посетитель не застаёт сайт наполовину обновлённым.

# HTML не кэшируем: правка в админке должна быть видна сразу после пересборки.
map $sent_http_content_type $site_expires {
    default     off;
    ~^text/html epoch;
}

# Заявки с сайта: не больше 6 в минуту с одного адреса, всплеск до 10.
limit_req_zone $binary_remote_addr zone=lead_api:10m rate=6r/m;

# Статистика страниц: страница шлёт 2–5 сигналов за просмотр, потолок с запасом.
limit_req_zone $binary_remote_addr zone=stats:10m rate=60r/m;

server {
    listen 80;
    server_name am-fabrika.ru www.am-fabrika.ru amfabrika.ru www.amfabrika.ru;
    access_log /var/log/nginx/access.log masked;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://am-fabrika.ru$request_uri;
    }
}

# Дубли адреса — на основной.
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name www.am-fabrika.ru amfabrika.ru www.amfabrika.ru;
    access_log /var/log/nginx/access.log masked;

    ssl_certificate     /etc/letsencrypt/live/am-fabrika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/am-fabrika.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://am-fabrika.ru$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name am-fabrika.ru;
    access_log /var/log/nginx/access.log masked;

    ssl_certificate     /etc/letsencrypt/live/am-fabrika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/am-fabrika.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Сайту не нужны камера, микрофон, геолокация и платёжные API — запрещаем
    # их и для встроенных чужих скриптов.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # Браузер узнаёт, что можно перейти на HTTP/3.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    # Сайт ещё не запущен: приём заявок выключен до уведомления в Роскомнадзор.
    # Снимается на запуске (задача 18 плана).
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /srv/site/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    expires $site_expires;

    location / {
        try_files $uri $uri/ =404;
    }

    # Приём заявок (lead-service). Адрес сервиса ищется на каждый запрос, поэтому
    # nginx стартует и отдаёт сайт, даже если сервиса нет — форма тогда
    # предлагает позвонить. Тело заявки держим в памяти, без временных файлов.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $lead_service http://lead-service:8080;
        limit_req zone=lead_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        client_body_buffer_size 16k;
        proxy_pass $lead_service;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Статистика страниц без cookie (frontend/src/scripts/stats.js). Ответ —
    # пустая картинка; запрос попадает только в свой журнал (формат stats в
    # 00-logging.conf), в общий журнал обращений с адресом не пишется. Папка
    # журнала — /opt/am-site/stats на сервере, переживает пересоздание
    # контейнера. Разбор: infra/stats-report.py.
    location = /s {
        access_log /var/log/am-stats/stats.log stats;
        limit_req zone=stats burst=30 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        empty_gif;
    }

    # Имена с хэшем сборки не меняются никогда.
    location ^~ /_astro/ {
        expires max;
    }

    # Фото из админки: время изменения зашито в имя файла, новое фото — новое
    # имя, поэтому кэшировать можно бессрочно.
    location ^~ /cms/ {
        expires max;
    }

    location ~* \.(?:webp|png|jpg|svg|ico|woff2)$ {
        expires 7d;
    }
}
