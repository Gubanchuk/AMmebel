# Формат журнала обращений для всех сайтов. Файл называется с 00-, потому
# что conf.d подключается по алфавиту, а формат должен быть объявлен раньше
# первого server, который на него ссылается.
#
# Адрес посетителя хранится без последнего октета IPv4 (у IPv6 — только
# первые три группы): по такому адресу человека не установить, а для разбора
# атак и ошибок хватает сети. Каждый server пишет журнал в этом формате
# вместо стандартного. Журнал ошибок nginx адреса не маскирует.
map $remote_addr $remote_addr_masked {
    "~^(?<net>[0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$"                    $net.0;
    "~^(?<net>[0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4})" $net::;
    default                                                        -;
}

log_format masked '$remote_addr_masked - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Журнал статистики страниц (frontend/src/scripts/stats.js, location = /s в
# site.conf): только время с точностью до минуты, статус и строка запроса.
# Ни адреса, ни браузера, ни referer — запись не связать с посетителем.
map $time_iso8601 $time_minute {
    "~^(?<minute>[0-9-]+T[0-9]+:[0-9]+)" $minute;
    default                               -;
}

log_format stats '$time_minute $status $args';
