# Админка Directus: admin.am-fabrika.ru
#
# Directus сидит в сети без интернета и снаружи не виден — весь доступ
# только через этот прокси.

# Ограничение частоты попыток входа. Пароль пароля, а перебор перебором:
# 5 запросов в минуту с адреса, короткий всплеск до 5 сверху разрешаем,
# дальше 429. Бьёт только по логину, остальная админка не страдает.
limit_req_zone $binary_remote_addr zone=directus_login:10m rate=5r/m;

server {
    listen 80;
    server_name admin.am-fabrika.ru;

    # Проверка владения доменом для Let's Encrypt — единственное, что
    # отвечает по голому http.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.am-fabrika.ru;

    ssl_certificate     /etc/letsencrypt/live/admin.am-fabrika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.am-fabrika.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Фото мебели весят прилично, дефолтный лимит в 1 МБ их не пропустит.
    client_max_body_size 50m;

    location /auth/login {
        limit_req zone=directus_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://directus:8055;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location / {
        proxy_pass http://directus:8055;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
