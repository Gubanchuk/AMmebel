# Всё, что не относится к известным сайтам: голый IP, сканеры, основной
# домен до переезда сайта на этот сервер.
#
# По http отвечаем только на проверку Let's Encrypt — так новые имена можно
# выпускать без временных конфигов. Остальное молча закрываем.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

# По https неизвестному имени не показываем сертификат админки, а рвём
# рукопожатие: иначе браузер увидел бы чужой сертификат и ошибку.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;

    # Кэш сессий nginx берёт у сервера по умолчанию сразу для всего порта,
    # а не у того, что обслуживает имя, — без этих строк возобновление
    # сессий не работало бы и на сайте, и в админке.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
}
