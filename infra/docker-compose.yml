services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - am-internal

  directus:
    image: dockerhub.timeweb.cloud/directus/directus:11
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL}
      TELEMETRY: "false"
    # Портов нет намеренно: при internal:true docker их всё равно не публикует.
    # Доступ к админке — через SSH-туннель на IP контейнера, до появления
    # обратного прокси (шаг В7). Хост видит контейнер, контейнер интернет — нет.
    volumes:
      - directus-uploads:/directus/uploads
    networks:
      - am-internal

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - directus
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      # Две сети: наружу за сертификатами и к посетителям, внутрь — к Directus.
      # Сам Directus остаётся только во внутренней и в интернет не ходит.
      - am-internal
      - am-edge

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - am-edge
    # Запускается вручную и по расписанию, постоянно висеть ему незачем.
    profiles:
      - tools

volumes:
  pgdata:
  directus-uploads:
  certbot-certs:
  certbot-webroot:

networks:
  # Внутренняя сеть без выхода в интернет: контейнеры видят друг друга,
  # наружу не ходят. Доступ к админке — только через обратный прокси (шаг В7).
  am-internal:
    internal: true
  # Обычная сеть с выходом наружу — только для прокси и выпуска сертификатов.
  am-edge:
