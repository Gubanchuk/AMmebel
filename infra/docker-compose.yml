services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - am-internal

  directus:
    image: dockerhub.timeweb.cloud/directus/directus:11
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL}
      TELEMETRY: "false"
    volumes:
      - directus-uploads:/directus/uploads
    networks:
      - am-internal

volumes:
  pgdata:
  directus-uploads:

networks:
  # Внутренняя сеть без выхода в интернет: контейнеры видят друг друга,
  # наружу не ходят. Доступ к админке — только через обратный прокси (шаг В7).
  am-internal:
    internal: true
